name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY"
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/headlines.p12"
      - name: Test, lint and build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/headlines.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p delivery
          cp android/app/build/outputs/apk/release/app-release.apk delivery/yesterday-headlines-1.0.0.apk
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yesterday-headlines-apk
          path: delivery/
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle -p android connectedDebugAndroidTest
            adb pull /sdcard/Download/launch.png android/app/build/reports/launch.png
            adb pull /sdcard/Download/splash.png android/app/build/reports/splash.png
      - name: Upload Android checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/headlines.p12"
